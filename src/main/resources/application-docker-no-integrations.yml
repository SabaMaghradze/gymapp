spring:
  application:
    name: gymapp
  cloud:
    config:
      enabled: false
  config:
    import: ""
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gymapp;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  activemq:
    broker-url: vm://embedded?broker.persistent=false,useJmx=false

jwt:
  secret: 36763979244226452948404D635166546A576D5A7134743777217A25432A462D
  expirationTime: 3600000

eureka:
  client:
    enabled: false

server:
  port: 8082

logging:
  level:
    root: INFO